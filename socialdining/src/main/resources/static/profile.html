<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>個人資料 - 社交餐飲平台</title>
    <style>
        /* 全域與版面設定 */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            align-items: center;
            background-color: #f58549;
            color: #fff;
            padding: 10px 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-right: 40px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }
        nav a {
            text-decoration: none;
            color: #fff;
            background-color: #f7a573;
            padding: 10px 18px;
            border-radius: 4px;
            transition: background-color 0.2s;
            font-size: 14px;
        }
        nav a:hover, nav a.active {
            background-color: #dd885f;
        }
        .logout-container {
            margin-left: auto;
        }
        .logout-container button {
            background-color: #e23b3b;
            border: none;
            color: #fff;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .logout-container button:hover {
            background-color: #b72f2f;
        }
        .content {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            flex: 1;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        form label {
            font-weight: bold;
        }
        form input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form button[type="submit"] {
            width: 150px;
            padding: 10px;
            background-color: #f7a573;
            border: none;
            color: #fff;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start;
            transition: background-color 0.2s;
        }
        form button[type="submit"]:hover {
            background-color: #dd885f;
        }
    </style>
</head>
<body>
<!-- 頂部導覽列 -->
<header>
    <div class="logo">社交餐飲平台</div>
    <nav>
        <ul>
            <li><a href="dashboard.html">瀏覽店家</a></li>
            <li><a href="profile.html" class="active">個人資料</a></li>
            <li><a href="dinners.html">我的餐會</a></li>
            <li><a href="reservations.html">我的預訂</a></li>
            <li><a href="notifications.html">通知</a></li>
        </ul>
    </nav>
    <div class="logout-container">
        <button id="logoutButton">登出</button>
    </div>
</header>

<!-- 內容區域 (個人資料) -->
<div class="content">
    <h2>個人資料</h2>
    <p>請更新您的個人資訊</p>
    <form id="profileForm">
        <div>
            <label>電子郵件：</label>
            <span id="userEmail"></span>
        </div>
        <div>
            <label for="userNickname">餐飲暱稱：</label>
            <input type="text" id="userNickname" name="nickname" required>
        </div>
        <div>
            <label for="oldPassword">舊密碼：</label>
            <input type="password" id="oldPassword" name="oldPassword" placeholder="輸入舊密碼">
        </div>
        <div>
            <label for="userPassword">新密碼：</label>
            <input type="password" id="userPassword" name="password" placeholder="若不修改請留空">
        </div>
        <div>
            <label for="confirmPassword">確認新密碼：</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="若不修改請留空">
        </div>
        <button type="submit">儲存更改</button>
    </form>
</div>

<script>
    // 從 localStorage 取得登入使用者資訊 (假設存入的是 email)
    let loggedInUser = localStorage.getItem("loggedInUser") || "未設定";

    // 登出功能
    document.getElementById("logoutButton").addEventListener("click", function(){
        localStorage.removeItem("loggedInUser");
        window.location.href = "index.html";
    });

    // 頁面載入後，呼叫 GET API 取得最新個人資料
    window.addEventListener('load', function(){
        fetch("http://localhost:8081/api/auth/profile?email=" + loggedInUser)
            .then(response => response.json())
            .then(data => {
                document.getElementById("userEmail").innerText = data.email;
                document.getElementById("userNickname").value = data.nickname || "";
            })
            .catch(err => console.error("取得使用者資料失敗:", err));
    });

    // 表單提交更新個人資料
    const profileForm = document.getElementById("profileForm");
    profileForm.addEventListener("submit", function(e) {
        e.preventDefault();
        const nickname = document.getElementById('userNickname').value.trim();
        const oldPassword = document.getElementById('oldPassword').value;
        const password = document.getElementById('userPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== "" && password !== confirmPassword) {
            alert("兩次密碼不一致！");
            return;
        }
        if (password !== "" && oldPassword === "") {
            alert("請輸入舊密碼以變更密碼！");
            return;
        }
        const updateProfileData = {
            email: loggedInUser,
            nickname: nickname,
            password: password,
            oldPassword: oldPassword
        };
        fetch("http://localhost:8081/api/auth/profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updateProfileData)
        })
            .then(response => response.text().then(data => {
                if (!response.ok) {
                    throw new Error(data);
                }
                return data;
            }))
            .then(data => {
                alert(data);
            })
            .catch(error => {
                console.error("更新個人資料 API 發生錯誤:", error);
                alert("更新失敗：" + error.message);
            });
    });
</script>
</body>
</html>
