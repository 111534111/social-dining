<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的預訂 - 社交餐飲平台</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #f58549;
      color: #fff;
      padding: 10px 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-right: 40px;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      margin: 0;
      padding: 0;
    }
    nav a {
      text-decoration: none;
      color: #fff;
      background-color: #f7a573;
      padding: 10px 18px;
      border-radius: 4px;
      transition: background-color 0.2s;
      font-size: 14px;
    }
    nav a:hover, nav a.active {
      background-color: #dd885f;
    }
    .logout-container {
      margin-left: auto;
    }
    .logout-container button {
      background-color: #e23b3b;
      border: none;
      color: #fff;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .logout-container button:hover {
      background-color: #b72f2f;
    }
    .content {
      width: 90%;
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      flex: 1;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">社交餐飲平台</div>
  <nav>
    <ul>
      <li><a href="dashboard.html">瀏覽店家</a></li>
      <li><a href="profile.html">個人資料</a></li>
      <li><a href="dinners.html">我的餐會</a></li>
      <li><a href="reservations.html" class="active">我的預訂</a></li>
      <li><a href="notifications.html">通知</a></li>
    </ul>
  </nav>
  <div class="logout-container">
    <button id="logoutButton">登出</button>
  </div>
</header>

<div class="content">
  <h2>我的預訂</h2>
  <p>這裡顯示您預訂參加的餐會列表：</p>
  <ul>
    <li>預訂一：10/15 素食私廚</li>
    <li>預訂二：10/25 西班牙海鮮飯聚餐</li>
  </ul>
</div>

<script>
  document.getElementById("logoutButton").addEventListener("click", function(){
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
